<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Summary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/view-transactions.css') }}"> <!--link css page-->
</head>
<body>
    <h1>Transaction History</h1>
    <table>
        <tr> 
            <th>Date</th>
            <th>Description</th>
            <th>Amount (VND)</th>
            <th>Type</th>
        </tr>
        {% for transaction in transactions %} <!--for loop like python-->
        <tr>
            <td>{{ transaction.date }}</td> <!--{{ variable }}-->
            <td>{{ transaction.item }}</td>
            <td class="{{ transaction.type.lower() }}"> <!--dynamic styling depends on 'income' or 'expense'-->
                {{ "{:,.0f}".format(transaction.amount) }} <!--format decimal in thousands eg. 100,000-->
            </td>
            <td>{{ transaction.type }}</td>
        </tr>
        {% endfor %}
    </table>
    <br>
    <nav class="navbar">
        <ul>
            <li><a href="{{ url_for('addTransaction') }}">Add New Transaction</a></li>
            <li><a href="{{ url_for('home') }}">Back to menu</a></li>
        </ul>
    </nav>
</body>
</html>
